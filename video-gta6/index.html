<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>GTA VI — Short</title>
<meta name="viewport" content="width=1080">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--pink:#ff2d95;--orange:#ff9a3c;--cyan:#19e6ff;--purple:#2a0a5e;--deep:#12062b;--yellow:#ffe45e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:'Jost',sans-serif;color:#fff}
#stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:var(--deep)}
.scene{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.ub{font-family:'Ubuntu',sans-serif;font-weight:700;letter-spacing:-.01em;text-transform:uppercase;font-style:italic}
.mask{display:block;overflow:hidden;padding:.1em .1em .16em;margin:-.1em -.1em -.16em}
.mask>span{display:inline-block;will-change:transform}
.pill{position:absolute;border-radius:999px;font-weight:600;display:flex;align-items:center;gap:16px;white-space:nowrap}
.chrome{background:linear-gradient(180deg,#fff 0%,#ffd1ec 38%,#ff2d95 52%,#7a1fff 64%,#ffb347 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.neon{text-shadow:0 0 12px currentColor,0 0 40px currentColor}
.orb{position:absolute;border-radius:50%;filter:blur(70px)}
</style></head>
<body><div id="stage"></div>
<script src="gsap.min.js"></script><script src="words.js"></script><script src="main.js"></script>
</body></html>
