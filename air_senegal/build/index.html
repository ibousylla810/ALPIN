<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Air Sénégal concept</title>
<link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#C11214;font-family:'Inter',sans-serif}
#st{position:absolute;inset:0;overflow:hidden;perspective:1700px;background:#C11214}
.a{position:absolute}
.L{position:absolute;inset:0;overflow:hidden}
.T{position:absolute;left:80px;width:860px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;word-spacing:.18em;line-height:1;white-space:nowrap}
.card{position:absolute;border-radius:26px;overflow:hidden;border:7px solid #fff;box-shadow:22px 22px 0 #2A2A2A;background:#fff}
.card img{display:block;width:100%}
.pan{position:absolute;inset:0}
</style></head><body><div id="st"></div>
<script src="gsap.min.js"></script>
<script>
const R='#DF231E',RU='#C11214',Y='#FBD925',G='#308D3E',K='#2A2A2A',Wt='#fff';
const st=document.getElementById('st');
const tl=gsap.timeline({paused:true,defaults:{ease:'power4.out'}});
function el(tag,css,p,html,cls){const d=document.createElement(tag);d.style.cssText=css||'';if(cls)d.className=cls;if(html!=null)d.innerHTML=html;(p||st).appendChild(d);return d;}
function layer(bg,z){return el('div','background:'+bg+';z-index:'+z+';display:none',st,null,'L');}
function show(L,t0,t1){tl.set(L,{display:'block'},t0);if(t1!=null)tl.set(L,{display:'none'},t1);}
// texte auto-ajusté (largeur max 860)
const FIT=[];function fit(d,max){const L=d.closest('.L');const was=L&&L.style.display;if(L)L.style.display='block';let f=max;d.style.fontSize=f+'px';const w=d.style.width;d.style.width='auto';while(d.offsetWidth>840&&f>30){f-=2;d.style.fontSize=f+'px';}d.style.width=w;if(L)L.style.display=was;}
function txt(p,s,top,max,color,extra){const d=el('div','top:'+top+'px;font-size:'+max+'px;color:'+color+';'+(extra||''),p,s,'T');FIT.push([d,max]);return d;}
function card(p,src,css){const c=el('div',css,p,null,'card');el('img','',c).src=src;return c;}
// panneaux de transition : bandes de couleur qui balaient
function sweep(t,cols,dir){cols.forEach((c,i)=>{const d=el('div','background:'+c+';z-index:'+(900+i)+';display:none',st,null,'pan');
  const from=dir=='x'?{xPercent:-101}:{yPercent:101}, mid=dir=='x'?{xPercent:0}:{yPercent:0}, to=dir=='x'?{xPercent:101}:{yPercent:-101};
  tl.set(d,{display:'block'},t-.36+i*.06);tl.fromTo(d,from,Object.assign({duration:.26,ease:'power3.in'},mid),t-.36+i*.06);
  tl.to(d,Object.assign({duration:.3,ease:'power3.out'},to),t-.06+i*.06);tl.set(d,{display:'none'},t+.4+i*.06);});}
function slam(n,t,o){tl.fromTo(n,Object.assign({scale:2.6,opacity:0},o||{}),{scale:1,opacity:1,duration:.32,ease:'power4.in'},t);
  tl.fromTo(st,{x:0,y:0},{x:14,y:-10,duration:.05,yoyo:true,repeat:3,ease:'none'},t+.32);}
function bounce(n,t){tl.fromTo(n,{y:-500,opacity:0},{y:0,opacity:1,duration:.55,ease:'bounce.out'},t);}
function whip(n,t,dx){tl.fromTo(n,{x:dx||1100,skewX:-25,opacity:0},{x:0,skewX:0,opacity:1,duration:.4,ease:'expo.out'},t);}
function out(n,t){tl.to(n,{opacity:0,y:-60,duration:.18,ease:'power2.in'},t);}
function floatC(n,t,d){tl.fromTo(n,{rotateY:-14,rotateX:6},{rotateY:14,rotateX:-6,duration:d,ease:'sine.inOut'},t);}
// bande rayée drapeau (vert-jaune-rouge du logo)
function stripes(p,top,t){['#308D3E','#FBD925','#DF231E'].forEach((c,i)=>{const s=el('div','left:-60px;top:'+(top+i*22)+'px;width:1300px;height:14px;background:'+c+';transform:rotate(-6deg);transform-origin:left',p,null,'a');
  tl.fromTo(s,{scaleX:0},{scaleX:1,duration:.5,ease:'expo.out'},t+i*.07);});}

/* ===== S1 HOOK 0–2.4 : 278 liaisons ===== */
{const L=layer(RU,10);show(L,0,2.45);
 const c=card(L,'assets/k_dest.png','left:250px;top:660px;width:580px;height:660px');
 tl.fromTo(c,{rotateX:70,y:500,opacity:0},{rotateX:12,y:0,opacity:1,duration:.7,ease:'expo.out'},0);
 tl.to(c.querySelector('img'),{y:-420,duration:2.4,ease:'none'},0);
 floatC(c,.6,1.8);
 const n=txt(L,'0',300,300,Wt,'text-shadow:12px 12px 0 #2A2A2A'); const o={v:0};
 tl.fromTo(n,{scale:.3,opacity:0},{scale:1,opacity:1,duration:.3,ease:'back.out(2)'},.1);
 tl.to(o,{v:278,duration:1.0,ease:'power2.out',onUpdate:()=>n.textContent=Math.round(o.v)},.15);
 const l=txt(L,'LIAISONS',1380,130,Y,'text-shadow:8px 8px 0 #2A2A2A');
 slam(l,1.15);
}
/* ===== S2 PAIEMENT 2.4–5.4 ===== */
sweep(2.45,[Y,G,Wt],'x');
{const L=layer(Wt,20);show(L,2.45,5.45);
 const bg=el('div','left:-200px;top:-200px;width:1500px;height:2400px;background:repeating-linear-gradient(-30deg,#fff 0 60px,#fbeaea 60px 120px)',L,null,'a');
 tl.fromTo(bg,{x:0},{x:-138,duration:3,ease:'none'},2.45);
 const c=card(L,'assets/k_pay.png','left:140px;top:820px;width:780px');
 tl.fromTo(c,{rotateY:-80,x:-300,opacity:0},{rotateY:-10,x:0,opacity:1,duration:.7,ease:'expo.out'},2.55);
 tl.to(c,{rotateY:10,rotateX:4,duration:2.2,ease:'sine.inOut'},3.25);
 const a=txt(L,'ORANGE MONEY',330,120,RU,'text-shadow:8px 8px 0 #FBD925');whip(a,2.6);out(a,3.95);
 const b=txt(L,'VISA · MASTERCARD',330,120,K,'text-shadow:8px 8px 0 #FBD925');whip(b,4.0,-1100);
 const p=txt(L,'PAYEZ PAR',230,60,G);bounce(p,2.75);
}
/* ===== S3 BAGAGES 5.4–8.6 ===== */
sweep(5.45,[R,K],'y');
{const L=layer(K,30);show(L,5.45,8.65);
 const h=el('div','inset:0;background:url(assets/c_hero_bag.png) center/cover',L,null,'a');
 tl.fromTo(h,{scale:1.9,filter:'blur(18px)'},{scale:1.15,filter:'blur(3px)',duration:.6,ease:'expo.out'},5.45);
 tl.to(h,{scale:1.3,duration:2.6,ease:'none'},6.05);
 el('div','inset:0;background:linear-gradient(180deg,rgba(193,18,20,.88),rgba(42,42,42,.9))',L,null,'a');
 const big=txt(L,'2 × 23 KG',420,190,Wt,'text-shadow:12px 12px 0 #DF231E');slam(big,5.6);
 tl.to(big,{y:-120,scale:.7,duration:.35,ease:'power3.inOut'},7.05);
 const c=card(L,'assets/k_bag.png','left:150px;top:760px;width:740px');
 tl.fromTo(c,{rotateX:-90,y:200,opacity:0,transformOrigin:'50% 0%'},{rotateX:0,y:0,opacity:1,duration:.6,ease:'back.out(1.6)'},7.1);
 floatC(c,7.7,1);
 const s=txt(L,'EN SOUTE',1330,110,Y,'text-shadow:8px 8px 0 #2A2A2A');whip(s,7.3);
}
/* ===== S4 TERANGA 8.6–12.2 ===== */
sweep(8.65,[G,Y],'x');
{const L=layer(RU,40);show(L,8.65,12.25);
 const h=el('div','left:0;top:0;width:1080px;height:1920px;background:url(assets/c_hero_ter.png) center/cover;opacity:.35',L,null,'a');
 tl.fromTo(h,{scale:1.6,rotate:-4},{scale:1.2,rotate:0,duration:3.6,ease:'power1.out'},8.65);
 const t=txt(L,'TERANGA',300,170,Wt,'text-shadow:10px 10px 0 #2A2A2A');
 tl.fromTo(t.childNodes.length?t:t,{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.45,ease:'expo.out'},8.8);
 stripes(L,520,9.0);
 const names=['IVORY','SILVER','GOLD','DIAMOND'],cols=['#fff',Wt,Y,K];
 names.forEach((n,i)=>{const x=80+(i%2)*440,y=660+Math.floor(i/2)*330;
  const w=el('div','left:'+x+'px;top:'+y+'px;width:420px;height:300px;transform-style:preserve-3d',L,null,'a');
  const f=el('div','inset:0;border-radius:24px;background:'+(i==3?K:i==2?Y:'#fff')+';border:6px solid #fff;box-shadow:16px 16px 0 #2A2A2A;display:flex;align-items:flex-end;padding:28px;backface-visibility:hidden;font-weight:900;font-size:56px;letter-spacing:.08em;color:'+(i==3?'#fff':RU),w,'<div><div style="font-size:24px;letter-spacing:.2em;color:'+(i==3?Y:K)+'">TERANGA</div>'+n+'</div>','a');
  const b=el('div','inset:0;border-radius:24px;background:'+G+';border:6px solid #fff;transform:rotateY(180deg);backface-visibility:hidden',w,null,'a');
  tl.fromTo(w,{rotateY:-180,opacity:0,z:-300},{rotateY:0,opacity:1,z:0,duration:.6,ease:'back.out(1.3)'},9.45+i*.22);
  tl.to(w,{rotateY:i%2?-12:12,rotateX:6,duration:1.6,ease:'sine.inOut'},10.6);
 });
 const n=txt(L,'4 NIVEAUX',1360,130,Y,'text-shadow:8px 8px 0 #2A2A2A');slam(n,10.45);
}
/* ===== S5 SALON VIP 12.2–14.8 ===== */
sweep(12.25,[Y,R],'y');
{const L=layer(Y,50);show(L,12.25,14.85);
 const ring=el('div','left:140px;top:600px;width:800px;height:800px;border-radius:50%;border:40px solid '+RU,L,null,'a');
 tl.fromTo(ring,{scale:0,rotate:-90},{scale:1,rotate:0,duration:.7,ease:'expo.out'},12.3);
 tl.to(ring,{scale:1.15,duration:2,ease:'sine.inOut'},13);
 const a=txt(L,'SALON VIP',300,170,RU,'text-shadow:10px 10px 0 #2A2A2A');
 tl.fromTo(a,{rotateX:-90,opacity:0,transformOrigin:'50% 100%'},{rotateX:0,opacity:1,duration:.45,ease:'back.out(2)'},12.4);
 const c=card(L,'assets/k_vip.png','left:170px;top:700px;width:700px');
 tl.fromTo(c,{z:-1200,rotateZ:-25,opacity:0},{z:0,rotateZ:-4,opacity:1,duration:.6,ease:'expo.out'},12.6);
 tl.to(c,{rotateZ:3,rotateY:12,duration:2,ease:'sine.inOut'},13.2);
 const b=txt(L,'GOLD · DIAMOND',1380,110,K,'text-shadow:6px 6px 0 #fff');bounce(b,13.55);
}
/* ===== S6 CONTACT 14.8–17.4 ===== */
sweep(14.85,[G,Wt,R],'x');
{const L=layer(K,60);show(L,14.85,17.45);
 stripes(L,250,14.9);
 const h=txt(L,'7H — 21H',520,210,Wt,'text-shadow:12px 12px 0 #DF231E');
 tl.fromTo(h,{rotateX:90,opacity:0,transformOrigin:'50% 50%'},{rotateX:0,opacity:1,duration:.5,ease:'back.out(1.8)'},15.0);
 const c=card(L,'assets/k_contact.png','left:200px;top:820px;width:640px');
 tl.fromTo(c,{y:900,rotate:18},{y:0,rotate:-3,duration:.6,ease:'back.out(1.4)'},15.55);
 floatC(c,16.1,1.3);
 const j=txt(L,'CHAQUE JOUR',1380,120,Y,'text-shadow:8px 8px 0 #DF231E');whip(j,16.15,-1100);
 tl.to(h,{scale:.8,y:-140,duration:.35,ease:'power3.inOut'},15.5);
}
/* ===== S7 MENTION 17.4–20.0 ===== */
sweep(17.45,[R,Y],'y');
{const L=layer(Wt,70);show(L,17.45,20.05);
 const band=el('div','left:0;top:640px;width:1080px;height:640px;background:'+RU,L,null,'a');
 tl.fromTo(band,{scaleY:0},{scaleY:1,duration:.4,ease:'expo.out'},17.5);
 const a=txt(L,'CONCEPT',730,130,Wt);const b=txt(L,'NON OFFICIEL',880,110,Y);
 const c=el('div','top:1060px;font-size:46px;color:#fff;line-height:1.25',L,'NON AFFILIÉ<br>À AIR SÉNÉGAL','T');
 [a,b,c].forEach((n,i)=>tl.fromTo(n,{x:-1100,opacity:0},{x:0,opacity:1,duration:.4,ease:'expo.out'},17.6+i*.12));
 const lg=el('img','left:80px;top:420px;width:300px;filter:brightness(0) saturate(100%)',L,null,'a');lg.src='assets/logo_white.png';
 tl.fromTo(lg,{opacity:0,y:30},{opacity:.85,y:0,duration:.4},17.8);
 tl.to([a,b,c],{x:8,duration:.9,yoyo:true,repeat:1,ease:'sine.inOut'},18.3);
}
/* ===== S8 FIN 20.0–23.0 ===== */
sweep(20.05,[K,G],'x');
{const L=layer(RU,80);show(L,20.05,null);
 stripes(L,1180,20.2);
 const a=txt(L,'ÉCRIS-MOI',420,170,Wt,'text-shadow:10px 10px 0 #2A2A2A');slam(a,20.1);
 const b=el('div','top:640px;font-size:66px;color:'+Y+';line-height:1.2;text-shadow:6px 6px 0 #2A2A2A',L,'EN MESSAGE<br>PRIVÉ','T');
 tl.fromTo(b,{y:200,opacity:0},{y:0,opacity:1,duration:.45,ease:'back.out(1.8)'},20.5);
 const lb=el('img','left:80px;top:1300px;width:150px;height:150px;border-radius:50%;object-fit:contain;background:#FAF7F3;padding:14px;border:5px solid #fff',L,null,'a');lb.src='assets/logo_b.png';
 const hd=el('div','left:255px;top:1350px;font-size:44px;font-weight:900;color:#fff;letter-spacing:.04em',L,'@brahim_design221','a');
 tl.fromTo(lb,{rotateY:180,scale:.3,opacity:0},{rotateY:0,scale:1,opacity:1,duration:.7,ease:'back.out(1.6)'},20.9);
 tl.fromTo(hd,{x:-60,opacity:0},{x:0,opacity:1,duration:.5},21.1);
 tl.fromTo(a,{scale:1},{scale:1.05,duration:.45,yoyo:true,repeat:3,ease:'sine.inOut'},21.3);
 tl.fromTo(lb,{rotate:0},{rotate:360,duration:1.2,ease:'power2.inOut'},21.9);
}
tl.duration(23);
window.__seek=t=>{tl.time(t,false);return true;};
window.__ready=Promise.all([document.fonts.load('900 100px Inter'),document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>0)),
 ...['assets/c_hero_bag.png','assets/c_hero_ter.png'].map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u;}))]).then(()=>{FIT.forEach(([d,m])=>fit(d,m));tl.time(0);return 1;});
</script></body></html>
